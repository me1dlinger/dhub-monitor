{% extends "base.html" %}

{% block content %}
<div class="page-head">
    <div>
        <h1 class="page-head__title" id="pageTitle">仪表盘</h1>
        <p class="page-head__sub" id="pageSub">正在加载监控数据…</p>
    </div>
    <div class="page-head__actions">
        <div class="controls">
            <div class="seg" id="daysSeg" role="group" aria-label="时间范围">
                <button type="button" class="seg__btn" data-days="7">7 天</button>
                <button type="button" class="seg__btn" data-days="14">14 天</button>
                <button type="button" class="seg__btn" data-days="30">30 天</button>
                <button type="button" class="seg__btn" data-days="90">90 天</button>
            </div>
            <select class="select select--compact" id="imageSelect" aria-label="选择镜像"></select>
        </div>
        <button type="button" class="btn btn--primary" id="refreshAll">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/><path d="M23 4v6h-6"/></svg>
            刷新数据
        </button>
    </div>
</div>

<div id="overallView">
    <section class="stats" id="statCards"></section>

    <section class="charts">
        <div class="card span-2 reveal" style="--delay:40ms">
            <header class="card__head">
                <div>
                    <h3 class="card__title">累计拉取趋势</h3>
                    <div class="card__sub">各镜像累计拉取总量随时间的变化；量级差异过大时自动切换对数刻度</div>
                </div>
                <div class="seg" id="totalsScaleSeg" role="group" aria-label="纵轴刻度">
                    <button type="button" class="seg__btn" data-scale="auto">自动</button>
                    <button type="button" class="seg__btn" data-scale="linear">线性</button>
                    <button type="button" class="seg__btn" data-scale="log">对数</button>
                </div>
            </header>
            <div class="card__body"><div class="chart" id="chartTotals"></div></div>
        </div>

        <div class="card span-2 reveal" style="--delay:80ms">
            <header class="card__head">
                <div>
                    <h3 class="card__title">每日拉取速率</h3>
                    <div class="card__sub">按观测间隔归一化后的日均新增拉取量</div>
                </div>
            </header>
            <div class="card__body"><div class="chart" id="chartDaily"></div></div>
        </div>

        <div class="card reveal" style="--delay:120ms">
            <header class="card__head">
                <div>
                    <h3 class="card__title">拉取分布</h3>
                    <div class="card__sub">各镜像累计拉取占比</div>
                </div>
            </header>
            <div class="card__body"><div class="chart" id="chartDistribution"></div></div>
        </div>

        <div class="card reveal" style="--delay:160ms">
            <header class="card__head">
                <div>
                    <h3 class="card__title">镜像排行</h3>
                    <div class="card__sub">按累计拉取量排序</div>
                </div>
            </header>
            <div class="card__body"><div class="chart" id="chartRanking"></div></div>
        </div>
    </section>
</div>

<div id="detailView" class="hidden">
    <div class="page-head">
        <div>
            <h1 class="page-head__title" id="detailName">--</h1>
            <p class="page-head__sub mono" id="detailRepo">--</p>
        </div>
        <div class="page-head__actions">
            <button type="button" class="btn" id="refreshOne">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/><path d="M23 4v6h-6"/></svg>
                刷新此镜像
            </button>
            <button type="button" class="btn" id="backToOverview">返回总览</button>
        </div>
    </div>

    <section class="stats" id="detailStats"></section>

    <section class="charts">
        <div class="card span-2">
            <header class="card__head">
                <div>
                    <h3 class="card__title">累计拉取趋势</h3>
                    <div class="card__sub">该镜像累计拉取总量</div>
                </div>
            </header>
            <div class="card__body"><div class="chart" id="chartDetailTotal"></div></div>
        </div>

        <div class="card span-2">
            <header class="card__head">
                <div>
                    <h3 class="card__title">每日拉取速率</h3>
                    <div class="card__sub">该镜像每日新增拉取量</div>
                </div>
            </header>
            <div class="card__body"><div class="chart" id="chartDetailDaily"></div></div>
        </div>

        <div class="card span-2">
            <header class="card__head">
                <div>
                    <h3 class="card__title">版本列表</h3>
                    <div class="card__sub" id="tagsSub">来自 Docker Hub 的标签信息</div>
                </div>
                <button type="button" class="btn btn--sm" id="refreshTags">刷新版本</button>
            </header>
            <div class="card__body" id="detailTags"></div>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js', v=asset_version) }}"></script>
{% endblock %}
